    <!-- Dashboard Cards -->
    <rect x="260" y="160" width="220" height="120" rx="12" fill="#f9fafb" stroke="#e4e4e7"/>
    <circle cx="290" cy="190" r="14" fill="#10b981" opacity="0.15"/>
