<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="smmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="accentSmm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="statGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#smmBg)"/>

  <!-- Browser Frame -->
  <g transform="translate(60, 50)">
    <rect width="1080" height="650" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 25px 35px rgba(0,0,0,0.06))"/>
    
    <!-- Window Bar -->
    <rect width="1080" height="46" rx="18" fill="#0f172a"/>
    <circle cx="28" cy="23" r="5.5" fill="#f87171" opacity="0.8"/>
    <circle cx="48" cy="23" r="5.5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="68" cy="23" r="5.5" fill="#34d399" opacity="0.8"/>
    
    <!-- Address Bar -->
    <rect x="240" y="9" width="600" height="28" rx="8" fill="#1e293b"/>
    <text x="540" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="500">
      🔒 https://www.socialuphub.in
    </text>

    <!-- App Header -->
    <rect x="0" y="46" width="1080" height="58" fill="#0f172a"/>
    <text x="35" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800" fill="#ffffff">
      SocialUpHub<tspan fill="#38bdf8">.in</tspan>
    </text>
    <rect x="180" y="66" width="125" height="22" rx="6" fill="#1e293b"/>
    <text x="242" y="81" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">#1 SMM PANEL INDIA</text>

    <text x="360" y="81" font-family="sans-serif" font-size="12" font-weight="500" fill="#94a3b8">New Order</text>
    <text x="460" y="81" font-family="sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Services API</text>
    <text x="560" y="81" font-family="sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Orders History</text>
    <text x="680" y="81" font-family="sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Add Funds</text>

    <!-- User Account Balance Pill -->
    <rect x="880" y="60" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="895" y="81" font-family="sans-serif" font-size="11" fill="#94a3b8">Balance:</text>
    <text x="955" y="82" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">₹4,850.00</text>

    <!-- 4 Stats Cards Row -->
    <g transform="translate(35, 125)">
      <!-- Stat 1 -->
      <rect x="0" y="0" width="235" height="90" rx="12" fill="url(#statGrad)" stroke="#e2e8f0"/>
      <text x="18" y="32" font-family="sans-serif" font-size="11" font-weight="600" fill="#64748b" text-transform="uppercase">Total Orders Processed</text>
      <text x="18" y="65" font-family="sans-serif" font-size="22" font-weight="800" fill="#0f172a">142,850+</text>
      <circle cx="205" cy="45" r="14" fill="#3b82f6" opacity="0.1"/>
      <text x="205" y="49" font-family="sans-serif" font-size="12" font-weight="800" fill="#2563eb" text-anchor="middle">⚡</text>

      <!-- Stat 2 -->
      <rect x="255" y="0" width="235" height="90" rx="12" fill="url(#statGrad)" stroke="#e2e8f0"/>
      <text x="273" y="32" font-family="sans-serif" font-size="11" font-weight="600" fill="#64748b" text-transform="uppercase">Active Services</text>
      <text x="273" y="65" font-family="sans-serif" font-size="22" font-weight="800" fill="#0f172a">1,240+</text>
      <circle cx="460" cy="45" r="14" fill="#10b981" opacity="0.1"/>
      <text x="460" y="49" font-family="sans-serif" font-size="12" font-weight="800" fill="#059669" text-anchor="middle">✓</text>

      <!-- Stat 3 -->
      <rect x="510" y="0" width="235" height="90" rx="12" fill="url(#statGrad)" stroke="#e2e8f0"/>
      <text x="528" y="32" font-family="sans-serif" font-size="11" font-weight="600" fill="#64748b" text-transform="uppercase">Avg Delivery Time</text>
      <text x="528" y="65" font-family="sans-serif" font-size="22" font-weight="800" fill="#0f172a">2.4 mins</text>
      <circle cx="715" cy="45" r="14" fill="#8b5cf6" opacity="0.1"/>
      <text x="715" y="49" font-family="sans-serif" font-size="12" font-weight="800" fill="#7c3aed" text-anchor="middle">⏱</text>

      <!-- Stat 4 -->
      <rect x="765" y="0" width="245" height="90" rx="12" fill="url(#statGrad)" stroke="#e2e8f0"/>
      <text x="783" y="32" font-family="sans-serif" font-size="11" font-weight="600" fill="#64748b" text-transform="uppercase">API Automation Status</text>
      <text x="783" y="65" font-family="sans-serif" font-size="18" font-weight="800" fill="#10b981">99.9% Uptime</text>
      <circle cx="980" cy="45" r="14" fill="#10b981" opacity="0.1"/>
      <text x="980" y="49" font-family="sans-serif" font-size="12" font-weight="800" fill="#059669" text-anchor="middle">●</text>
    </g>

    <!-- Main Order Form & Activity Grid -->
    <g transform="translate(35, 235)">
      <!-- Left: New Order Dispatch Form -->
      <rect x="0" y="0" width="580" height="375" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="24" y="36" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">Instant Order Dispatch System</text>
      
      <!-- Field 1: Category -->
      <text x="24" y="70" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569">Category</text>
      <rect x="24" y="80" width="532" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="40" y="106" font-family="sans-serif" font-size="13" fill="#0f172a">Instagram — Guaranteed Real Likes &amp; Engagement [Instant]</text>

      <!-- Field 2: Service -->
      <text x="24" y="145" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569">Service</text>
      <rect x="24" y="155" width="532" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="40" y="181" font-family="sans-serif" font-size="12" fill="#0f172a">ID 402 - HQ Non-Drop Followers | Speed: 20k/day | Lifetime Guarantee (₹48 / 1000)</text>

      <!-- Field 3: Link -->
      <text x="24" y="220" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569">Target Link</text>
      <rect x="24" y="230" width="532" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="40" y="255" font-family="sans-serif" font-size="12" fill="#94a3b8">https://instagram.com/username</text>

      <!-- Field 4: Quantity & Charge -->
      <rect x="24" y="285" width="250" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="40" y="309" font-family="sans-serif" font-size="12" fill="#0f172a">Quantity: 5,000</text>

      <rect x="290" y="285" width="266" height="38" rx="8" fill="#f1f5f9"/>
      <text x="310" y="309" font-family="sans-serif" font-size="12" font-weight="600" fill="#0f172a">Total Charge: ₹240.00</text>

      <!-- Submit button -->
      <rect x="24" y="335" width="532" height="35" rx="8" fill="url(#accentSmm)"/>
      <text x="290" y="357" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Place Instant Order →</text>

      <!-- Right: Real-time API Pipeline & Feed -->
      <rect x="610" y="0" width="400" height="375" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="635" y="36" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">Live Real-Time Activity</text>
      
      <!-- Activity Feed Items -->
      <g transform="translate(635, 60)">
        <rect width="350" height="58" rx="8" fill="#f8fafc" stroke="#f1f5f9"/>
        <circle cx="25" cy="29" r="6" fill="#10b981"/>
        <text x="45" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Order #89201 Completed</text>
        <text x="45" y="44" font-family="sans-serif" font-size="10" fill="#64748b">10,000 YouTube Views • 4s ago</text>
        <text x="330" y="33" font-family="sans-serif" font-size="11" font-weight="700" fill="#10b981" text-anchor="end">SUCCESS</text>
      </g>

      <g transform="translate(635, 130)">
        <rect width="350" height="58" rx="8" fill="#f8fafc" stroke="#f1f5f9"/>
        <circle cx="25" cy="29" r="6" fill="#3b82f6"/>
        <text x="45" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Order #89202 Processing</text>
        <text x="45" y="44" font-family="sans-serif" font-size="10" fill="#64748b">2,500 Instagram Likes • 12s ago</text>
        <text x="330" y="33" font-family="sans-serif" font-size="11" font-weight="700" fill="#2563eb" text-anchor="end">IN PROGRESS</text>
      </g>

      <g transform="translate(635, 200)">
        <rect width="350" height="58" rx="8" fill="#f8fafc" stroke="#f1f5f9"/>
        <circle cx="25" cy="29" r="6" fill="#10b981"/>
        <text x="45" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">API Key Dispatched</text>
        <text x="45" y="44" font-family="sans-serif" font-size="10" fill="#64748b">Reseller v2 REST Endpoint • 28s ago</text>
        <text x="330" y="33" font-family="sans-serif" font-size="11" font-weight="700" fill="#10b981" text-anchor="end">OK</text>
      </g>

      <!-- Mini Chart -->
      <g transform="translate(635, 275)">
        <rect width="350" height="85" rx="8" fill="#0f172a"/>
        <text x="15" y="25" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Real-Time Throughput (Req/sec)</text>
        <path d="M 20 65 Q 80 40, 140 55 T 240 30 T 330 45" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
        <circle cx="330" cy="45" r="4" fill="#34d399"/>
      </g>

    </g>

  </g>
</svg>
