<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="p3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5" />
      <stop offset="100%" stop-color="#eeeeee" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#p3bg)"/>
  <g transform="translate(180, 50)">
    <!-- Mobile App Frame preview -->
    <rect width="440" height="500" rx="36" fill="#ffffff" stroke="#e4e4e7" stroke-width="2" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.06))"/>
    <!-- Speaker & Notch -->
    <rect x="170" y="16" width="100" height="6" rx="3" fill="#e4e4e7"/>
    <circle cx="285" cy="19" r="3" fill="#d4d4d8"/>
    
    <!-- App Screen Header -->
    <rect x="30" y="55" width="180" height="20" rx="4" fill="#09090b"/>
    <rect x="30" y="85" width="260" height="10" rx="4" fill="#a1a1aa"/>
    <circle cx="390" cy="70" r="18" fill="#f4f4f5"/>

    <!-- Action Balance Card -->
    <rect x="30" y="125" width="380" height="130" rx="16" fill="#09090b"/>
    <text x="50" y="155" font-family="sans-serif" font-size="12" fill="#a1a1aa">TOTAL VOLUME</text>
    <text x="50" y="195" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">₹48,920.00</text>
    <rect x="50" y="215" width="110" height="22" rx="11" fill="#10b981" opacity="0.2"/>
    <text x="65" y="230" font-family="sans-serif" font-size="11" font-weight="600" fill="#10b981">+24.5% active</text>

    <!-- App List Items -->
    <rect x="30" y="275" width="380" height="55" rx="12" fill="#fafafa" stroke="#f4f4f5"/>
    <circle cx="60" cy="302" r="14" fill="#10b981" opacity="0.15"/>
    <rect x="90" y="293" width="120" height="10" rx="3" fill="#18181b"/>
    <rect x="90" y="309" width="70" height="8" rx="3" fill="#a1a1aa"/>
    <rect x="330" y="298" width="60" height="10" rx="3" fill="#10b981"/>

    <rect x="30" y="340" width="380" height="55" rx="12" fill="#fafafa" stroke="#f4f4f5"/>
    <circle cx="60" cy="367" r="14" fill="#3b82f6" opacity="0.15"/>
    <rect x="90" y="358" width="140" height="10" rx="3" fill="#18181b"/>
    <rect x="90" y="374" width="85" height="8" rx="3" fill="#a1a1aa"/>
    <rect x="330" y="363" width="60" height="10" rx="3" fill="#18181b"/>

    <!-- Bottom Nav bar -->
    <rect x="0" y="440" width="440" height="60" rx="0 0 36 36" fill="#ffffff" stroke="#f4f4f5"/>
    <circle cx="90" cy="465" r="8" fill="#10b981"/>
    <circle cx="180" cy="465" r="8" fill="#d4d4d8"/>
    <circle cx="260" cy="465" r="8" fill="#d4d4d8"/>
    <circle cx="350" cy="465" r="8" fill="#d4d4d8"/>
  </g>
</svg>
