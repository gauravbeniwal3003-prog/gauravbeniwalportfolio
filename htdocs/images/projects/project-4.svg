<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="p4bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#edf2f7" />
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#p4bg)"/>
  <g transform="translate(80, 70)">
    <rect width="1040" height="610" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.05))"/>
    
    <!-- Top Nav bar -->
    <rect width="1040" height="52" rx="16" fill="#f8fafc"/>
    <line x1="0" y1="52" x2="1040" y2="52" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="28" cy="26" r="6" fill="#ef4444" opacity="0.6"/>
    <circle cx="48" cy="26" r="6" fill="#f59e0b" opacity="0.6"/>
    <circle cx="68" cy="26" r="6" fill="#10b981" opacity="0.6"/>
    <rect x="110" y="18" width="180" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="920" y="16" width="90" height="20" rx="10" fill="#10b981"/>

    <!-- Hero Content in Project Frame -->
    <rect x="80" y="100" width="160" height="22" rx="11" fill="#ecfdf5"/>
    <text x="96" y="115" font-family="sans-serif" font-size="11" font-weight="600" fill="#059669">PRODUCTION CLOUD ARCHITECTURE</text>
    
    <rect x="80" y="140" width="560" height="32" rx="6" fill="#0f172a"/>
    <rect x="80" y="185" width="480" height="14" rx="4" fill="#64748b"/>
    <rect x="80" y="210" width="420" height="14" rx="4" fill="#94a3b8"/>

    <!-- Architecture Nodes flow -->
    <g transform="translate(80, 260)">
      <!-- Client box -->
      <rect x="0" y="40" width="180" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="20" y="60" width="40" height="40" rx="8" fill="#10b981" opacity="0.15"/>
      <text x="70" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Edge Gateway</text>
      <text x="20" y="130" font-family="monospace" font-size="11" fill="#64748b">Latency: &lt;12ms</text>

      <!-- Connection line -->
      <line x1="180" y1="105" x2="270" y2="105" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4"/>

      <!-- Core API box -->
      <rect x="270" y="20" width="220" height="170" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(16,185,129,0.1))"/>
      <rect x="290" y="40" width="40" height="40" rx="8" fill="#10b981"/>
      <text x="340" y="65" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Distributed Core</text>
      <rect x="290" y="100" width="180" height="10" rx="4" fill="#f1f5f9"/>
      <rect x="290" y="120" width="140" height="10" rx="4" fill="#f1f5f9"/>
      <text x="290" y="160" font-family="monospace" font-size="11" fill="#10b981">● 99.99% Uptime Engine</text>

      <!-- Connection lines -->
      <line x1="490" y1="80" x2="580" y2="50" stroke="#94a3b8" stroke-width="2"/>
      <line x1="490" y1="130" x2="580" y2="160" stroke="#94a3b8" stroke-width="2"/>

      <!-- Database & Workers boxes -->
      <rect x="580" y="10" width="280" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="600" y="45" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Replicated Storage Cluster</text>
      <text x="600" y="68" font-family="monospace" font-size="11" fill="#64748b">PostgreSQL + Redis Cache</text>

      <rect x="580" y="120" width="280" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="600" y="155" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Async Task Workers</text>
      <text x="600" y="178" font-family="monospace" font-size="11" fill="#64748b">BullMQ Queue + Webhooks</text>
    </g>
  </g>
</svg>
